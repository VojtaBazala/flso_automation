name: FCR & aFRR Download

on:
  schedule:
    # FCR – první pokus v 8:16 SEČ (7:16 UTC)
    - cron: '16 7 * * 1-5'
    # FCR retry každých 5 minut do 9:16
    - cron: '21 7 * * 1-5'
    - cron: '26 7 * * 1-5'
    - cron: '31 7 * * 1-5'
    - cron: '36 7 * * 1-5'
    - cron: '41 7 * * 1-5'
    - cron: '46 7 * * 1-5'
    - cron: '51 7 * * 1-5'
    - cron: '56 7 * * 1-5'
    - cron: '01 8 * * 1-5'
    - cron: '06 8 * * 1-5'
    - cron: '11 8 * * 1-5'
    # aFRR – první pokus v 9:16 SEČ (8:16 UTC)
    - cron: '16 8 * * 1-5'
    # aFRR retry každých 5 minut do 10:16
    - cron: '21 8 * * 1-5'
    - cron: '26 8 * * 1-5'
    - cron: '31 8 * * 1-5'
    - cron: '36 8 * * 1-5'
    - cron: '41 8 * * 1-5'
    - cron: '46 8 * * 1-5'
    - cron: '51 8 * * 1-5'
    - cron: '56 8 * * 1-5'
    - cron: '01 9 * * 1-5'
    - cron: '06 9 * * 1-5'
    - cron: '11 9 * * 1-5'
    # mFRR +/- – první pokus v 10:16 SEČ (9:16 UTC)
    - cron: '16 9 * * 1-5'
    # mFRR retry každých 5 minut do 11:16
    - cron: '21 9 * * 1-5'
    - cron: '26 9 * * 1-5'
    - cron: '31 9 * * 1-5'
    - cron: '36 9 * * 1-5'
    - cron: '41 9 * * 1-5'
    - cron: '46 9 * * 1-5'
    - cron: '51 9 * * 1-5'
    - cron: '56 9 * * 1-5'
    - cron: '01 10 * * 1-5'
    - cron: '06 10 * * 1-5'
    - cron: '11 10 * * 1-5'
    # Pokračování retry všech každých 30 minut do 23:00
    - cron: '16 10 * * 1-5'
    - cron: '46 10 * * 1-5'
    - cron: '16 11 * * 1-5'
    - cron: '46 11 * * 1-5'
    - cron: '16 12 * * 1-5'
    - cron: '46 12 * * 1-5'
    - cron: '16 13 * * 1-5'
    - cron: '46 13 * * 1-5'
    - cron: '16 14 * * 1-5'
    - cron: '46 14 * * 1-5'
    - cron: '16 15 * * 1-5'
    - cron: '46 15 * * 1-5'
    - cron: '16 16 * * 1-5'
    - cron: '46 16 * * 1-5'
    - cron: '16 17 * * 1-5'
    - cron: '46 17 * * 1-5'
    - cron: '16 18 * * 1-5'
    - cron: '46 18 * * 1-5'
    - cron: '16 19 * * 1-5'
    - cron: '46 19 * * 1-5'
    - cron: '16 20 * * 1-5'
    - cron: '46 20 * * 1-5'
    - cron: '16 21 * * 1-5'
    - cron: '46 21 * * 1-5'
    - cron: '46 22 * * 1-5'
  workflow_dispatch:

jobs:
  fcr:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - name: Date
        id: d
        run: echo "d=$(TZ=Europe/Prague date +%F)" >> $GITHUB_OUTPUT

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Fetch DATABASE_URL from Heroku
        env:
          HEROKU_API_TOKEN: ${{ secrets.HEROKU_API_TOKEN }}
        run: |
          RESP=$(curl -sS -w "\n%{http_code}" https://api.heroku.com/apps/cepsonline/config-vars -H "Accept: application/vnd.heroku+json; version=3" -H "Authorization: Bearer $HEROKU_API_TOKEN") || { echo "CHYBA: curl na Heroku API selhal (sit/DNS)"; exit 1; }
          CODE=$(echo "$RESP" | tail -n1)
          BODY=$(echo "$RESP" | sed '$d')
          if [ "$CODE" != "200" ]; then echo "CHYBA: Heroku HTTP $CODE: $BODY"; exit 1; fi
          DB_URL=$(echo "$BODY" | python3 -c "import sys,json; print(json.load(sys.stdin)['DATABASE_URL'])")
          echo "::add-mask::$DB_URL"
          echo "DATABASE_URL=$DB_URL" >> $GITHUB_ENV

      - name: Install dependencies
        run: pip install requests pandas openpyxl "sqlalchemy<2.1" psycopg2-binary

      - name: Check if FCR already downloaded today
        id: check_fcr
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
        run: |
          python3 -c "
          import os
          from datetime import datetime, timedelta
          from sqlalchemy import create_engine, text
          db = os.environ['DATABASE_URL'].replace('postgres://', 'postgresql://', 1)
          engine = create_engine(db)
          delivery = (datetime.now() + timedelta(days=1)).strftime('%Y-%m-%d')
          with engine.connect() as conn:
              result = conn.execute(text('SELECT COUNT(*) FROM fcr_overview WHERE trade_date = :d'), {'d': delivery})
              count = result.scalar()
          print(f'FCR rows for {delivery}: {count}')
          if count > 0:
              print('FCR_DONE=true')
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write('fcr_done=true\n')
          else:
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write('fcr_done=false\n')
          " || echo "fcr_done=false" >> $GITHUB_OUTPUT

      - name: Run FCR download
        if: steps.check_fcr.outputs.fcr_done != 'true'
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          FIRST_RUN: ${{ github.event.schedule == '16 7 * * 1-5' && 'true' || 'false' }}
        run: python fcr_download.py

      - name: Alert already sent today?
        id: alert
        if: failure()
        uses: actions/cache/restore@v4
        with:
          path: .alert_sent
          key: alert-${{ github.job }}-${{ steps.d.outputs.d }}
          lookup-only: true

      - name: Send ONE failure email per day
        if: failure() && steps.alert.outputs.cache-hit != 'true'
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          JOB: ${{ github.job }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import os, smtplib
          from email.mime.text import MIMEText
          from config import EMAIL_RECIPIENTS
          u = "oldrich.bazala@gmail.com"
          m = MIMEText(f"Job {os.environ['JOB']} selhal.\nDalsi email az zitra.\nLog: {os.environ['RUN_URL']}", "plain", "utf-8")
          m["Subject"] = f"CHYBA {os.environ['JOB']} (dnes uz dalsi email neprijde)"
          m["From"] = u; m["To"] = ", ".join(EMAIL_RECIPIENTS)
          with smtplib.SMTP_SSL("smtp.gmail.com", 465) as s:
              s.login(u, os.environ["GMAIL_APP_PASSWORD"]); s.sendmail(u, EMAIL_RECIPIENTS, m.as_string())
          PY
          mkdir -p .alert_sent && date > .alert_sent/sent

      - name: Remember alert sent
        if: failure() && steps.alert.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .alert_sent
          key: alert-${{ github.job }}-${{ steps.d.outputs.d }}

