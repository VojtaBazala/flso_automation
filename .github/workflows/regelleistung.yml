          DB_URL=$(echo "$BODY" | python3 -c "import sys,json; print(json.load(sys.stdin)['DATABASE_URL'])")
          echo "::add-mask::$DB_URL"
          echo "DATABASE_URL=$DB_URL" >> $GITHUB_ENV

      - name: Install dependencies
        run: pip install requests pandas openpyxl "sqlalchemy<2.1" psycopg2-binary

      - name: Check if aFRR already downloaded today
        id: check_afrr
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
        run: |
          python3 -c "
          import os
          from datetime import datetime, timedelta
          from sqlalchemy import create_engine, text
          db = os.environ['DATABASE_URL'].replace('postgres://', 'postgresql://', 1)
          engine = create_engine(db)
          delivery = (datetime.now() + timedelta(days=1)).strftime('%Y-%m-%d')
          with engine.connect() as conn:
              result = conn.execute(text('SELECT COUNT(*) FROM afrr_overview WHERE trade_date = :d'), {'d': delivery})
              count = result.scalar()
          print(f'aFRR rows for {delivery}: {count}')
          if count > 0:
