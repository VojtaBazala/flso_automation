        run: |
          python3 - <<'PY'
          import os, smtplib
          from email.mime.text import MIMEText
          from config import EMAIL_RECIPIENTS
          u = "oldrich.bazala@gmail.com"
          m = MIMEText(f"Job {os.environ['JOB']} selhal.\nDalsi email az zitra.\nLog: {os.environ['RUN_URL']}", "plain", "utf-8")
          m["Subject"] = f"CHYBA {os.environ['JOB']} (dnes uz dalsi email neprijde)"
          m["From"] = u; m["To"] = ", ".join(EMAIL_RECIPIENTS)
          with smtplib.SMTP_SSL("smtp.gmail.com", 465) as s:
              s.login(u, os.environ["GMAIL_APP_PASSWORD"]); s.sendmail(u, EMAIL_RECIPIENTS, m.as_string())
          PY
          mkdir -p .alert_sent && date > .alert_sent/sent

      - name: Remember alert sent
